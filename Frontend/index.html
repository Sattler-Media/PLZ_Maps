<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="Maps.css" />
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
  <title>Preisberechnung</title>  
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="p-3 m-0 border-0 bd-example m-0 border-0">   
  <div id="map-controls"> 
       
    <div class="header">
      <h1>Preisberechnung</h1> 
    </div>
     <!-- 1. offcanvass Button -->
    <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMain" aria-controls="offcanvasMain">
      Versandoptionen
    </button> 
        <!-- 1. offcanvas -->
    <div class="offcanvas offcanvas-start" data-bs-backdrop="false" tabindex="-1" id="offcanvasMain" aria-labelledby="offcanvasMainLabel">
      <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="offcanvasMainLabel">Versandoptionen</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body">
        <div class="menu">
          <div class="options">
            <label for="versandTyp">Versandtyp:</label>
              <select id="versandTyp" class="form-select">
                <option value="postaktuell" selected>Postaktuell</option>
                <option value="postwurfsp">Postwurf Spezial</option>
              </select>
      
              <label for="gewicht">Gewicht (g):</label>
              <input type="number" id="gewicht" />

              <label for="einlieferung">Einlieferungsdatum:              
              </label>
              <input type="date" id="einlieferung" />

              <label for="produktVariante">Produktvariante:</label>
              <select id="produktVariante">
                <option value="1">Alle Haushalte</option>                
                <option value="3">Haushalte mit Tagespost</option>
              </select>

              <label for="bezirksAuswahl">Bezirksauswahl:</label>
              <select id="bezirksAuswahl">
                <option value="true">Ja</option>
                <option value="false">Nein</option>
              </select>
              
          </div>
        </div>
      </div>
    </div>    
<!-- 2. offcanvas -->
    <div class="offcanvas offcanvas-end" data-bs-backdrop="false" tabindex="-1" id="postwurfSpezialCanvas" aria-labelledby="postwurfSpezialLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="postwurfSpezialLabel">Postwurf Spezial Optionen</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body">
            <div class ="content">              
              <div class="postwurfsp-options">
                <label for="laenge">Länge (dm):</label>
                <input type="number" id="laenge" />

                <label for="breite">Breite (dm):</label>
                <input type="number" id="breite" />

                <label for="hoehe">Höhe (dm):</label>
                <input type="number" id="hoehe" />

                <label for="postkarte">Postkarte:</label>
                <select id="postkarte">
                  <option value="true">Ja</option>
                  <option value="false">Nein</option>
                </select>

                <label for="automation">Automatisierung:</label>
                <select id="automation">
                  <option value="true">Ja</option>
                  <option value="false">Nein</option>
                </select>

                <label for="frankierung">Frankierungstyp:</label>
                <select id="frankierung">
                  <option value="1">Frankiervermerk</option>
                  <option value="3">DV Freimachung</option>
                  <option value="5">Frankierservice</option>
                  <option value="7">Plusbrief</option>
                  <option value="10">Frankit</option>
                  <option value="11">Postwertzeichen</option>
                  <option value="13">Internetmarke</option>
                </select>
              </div>
      
    </div>
      </div>
    </div>
        <div class="footer">
          
          <h3>Ergebnisse</h3>
          <label for="Einwohner">Einwohner:         
          </label>
          <input type="text" id="Einwohner" readonly/>

          <label for="Preis">Preis:</label>
          <input type="text" id="Preis" readonly />
          <div id="preisFehler" style="color: red; font-size: 0.9em; margin-top: 4px;"></div>            
    </div>   
  </div>
  
<!-- Karte -->  
<div id="map">
  <label>
    <input type="checkbox" id="checkDefault">
    Auswahl immer sichtbar
  </label>   
</div>
<button id="clearSelections">Alle Selektionen löschen</button> 

<!-- Scripts -->
  <script type="module" src="Map.js"></script>
  <script type="module" src="preisHandler.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const versandTyp = document.getElementById("versandTyp");
      versandTyp.addEventListener("change", function () {
        if (versandTyp.value === "postwurfsp") {
          const offcanvasElement = document.getElementById("postwurfSpezialCanvas");
          const bsOffcanvas = new bootstrap.Offcanvas(offcanvasElement);
          bsOffcanvas.show();
        }
      });
    });
  </script>

</body>
</html>
